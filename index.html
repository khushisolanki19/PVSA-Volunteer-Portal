<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#153f3a">
  <title>JCNC Volunteer Portal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <button class="brand" onclick="showView('home')" aria-label="Go home"><span class="brand-mark">J</span><span>JCNC <b>Volunteer</b></span></button>
      <div id="account-area"></div>
    </header>

    <main>
      <section id="home-view" class="view"></section>
      <section id="projects-view" class="view hidden"></section>
      <section id="hours-view" class="view hidden"></section>
      <section id="manage-view" class="view hidden"></section>
    </main>

    <nav class="bottom-nav" aria-label="Main navigation">
      <button data-view="home" class="active"><span>⌂</span>Home</button>
      <button data-view="projects"><span>◇</span>Projects</button>
      <button data-view="hours"><span>◷</span>Hours</button>
      <button data-view="manage" id="manage-tab"><span>⚙</span>Manage</button>
    </nav>
  </div>

  <div id="login-screen" class="login-screen">
    <form class="login-card" onsubmit="emailSignIn(event)">
      <span class="brand-mark">J</span>
      <p class="eyebrow">JCNC PVSA 2026–27</p>
      <h1>Volunteer sign in</h1>
      <p>Use the email connected to your volunteer account. This keeps other people from signing up in your name.</p>
      <label>Email address<input name="email" type="email" autocomplete="email" placeholder="you@example.org" required></label>
      <button class="primary wide" type="submit">Continue with email</button>
      <small>Demo emails: riana.jain@example.org, khushi.solanki@example.org, rashi.solanki@example.org, coordinator@example.org</small>
    </form>
  </div>

  <dialog id="app-dialog"><button class="dialog-close" onclick="closeDialog()" aria-label="Close">×</button><div id="dialog-body"></div></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
