<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#153f3a">
  <title>JCNC Volunteer Portal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <button class="brand" onclick="showView('home')" aria-label="Go home"><span class="brand-mark">J</span><span>JCNC <b>Volunteer</b></span></button>
      <div class="profile-switcher">
        <label for="active-user">Viewing as</label>
        <select id="active-user" aria-label="Choose demo user"></select>
      </div>
    </header>

    <main>
      <section id="home-view" class="view"></section>
      <section id="projects-view" class="view hidden"></section>
      <section id="hours-view" class="view hidden"></section>
      <section id="manage-view" class="view hidden"></section>
    </main>

    <nav class="bottom-nav" aria-label="Main navigation">
      <button data-view="home" class="active"><span>⌂</span>Home</button>
      <button data-view="projects"><span>◇</span>Projects</button>
      <button data-view="hours"><span>◷</span>Hours</button>
      <button data-view="manage" id="manage-tab"><span>⚙</span>Manage</button>
    </nav>
  </div>

  <dialog id="app-dialog"><button class="dialog-close" onclick="closeDialog()" aria-label="Close">×</button><div id="dialog-body"></div></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
